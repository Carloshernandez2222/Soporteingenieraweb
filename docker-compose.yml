# SQL Server local / GitHub Codespaces (TrackAidDB)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trackaid-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TrackAid_Secure2026!"
    ports:
      - "1433:1433"
    volumes:
      - trackaid_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  trackaid_sql_data:
